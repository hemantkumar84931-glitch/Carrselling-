{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="navbar">
    <a href="/">🏠 Home</a>
    <a href="/buy/">🚗 Buy Cars</a>
    <a href="/sell/">➕ Sell Car</a>
    <a href="/my-cars/">📋 My Cars</a>
    <a href="/my-wishlist/">❤️ Wishlist</a>
    <a href="/logout/">🚪 Logout</a>
</div>

<div class="container">
    <div class="card">
        <h1>👤 My Profile</h1>

        <p><strong>Username:</strong> {{ request.user.username }}</p>
        <p><strong>Email:</strong> {{ request.user.email }}</p>
        <p><strong>Total Cars:</strong> {{ total_cars }}</p>
        <p><strong>Wishlist Cars:</strong> {{ wishlist_count }}</p>
    </div>
</div>

</body>
</html>
