<!DOCTYPE html>
<html>
<head>
    <title>Sell Your Car</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 20px;
        }

        .form-box {
            background: white;
            max-width: 500px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 2px 10px #ccc;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 16px;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="form-box">

    <h1>🚗 Sell Your Car</h1>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label>Company</label>
        <input type="text" name="company" placeholder="e.g. Maruti" required>

        <label>Model</label>
        <input type="text" name="model" placeholder="e.g. Swift" required>

        <label>Year</label>
        <input type="number" name="year" placeholder="e.g. 2022" required>

        <label>Price</label>
        <input type="number" name="price" placeholder="e.g. 600000" required>

        <label>Phone Number</label>
        <input type="tel" name="phone" placeholder="Your phone number" required>

        <label>Description</label>
        <textarea name="description" rows="5"
                  placeholder="Describe your car..." required></textarea>
         <label>📷 Car Photo</label><br>
         <input type="file" name="image" accept="image/*"><br><br>

        <button type="submit">🚗 Sell Car</button>
    </form>

    <br>

    <a href="/">← Back to Home</a>

</div>

</body>
</html>
